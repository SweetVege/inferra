[project]
name = "inferra-api"
version = "0.1.0"
description = "Inferra API, agent runtime, and analysis tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.17",
  "itsdangerous>=2.2",
  "httpx>=0.28",
  "duckdb>=1.1",
  "pyarrow>=18",
  "pandas>=2.2",
  "numpy>=2.1",
  "scipy>=1.14",
  "openpyxl>=3.1",
  "boto3>=1.35",
  "anthropic>=1.15",
  "statsmodels>=0.15.0",
  "scikit-learn>=1.9.1",
  "lightgbm>=4.7.0",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inferra"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"inferra/agents/prompts.py" = ["E501"]
"tests/*" = ["E501"]
"inferra/llm/demo_script.py" = ["E501"]
